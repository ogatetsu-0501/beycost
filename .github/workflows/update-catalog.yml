name: Update Beyblade X catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/scrape_beycost.py"
      - ".github/workflows/update-catalog.yml"
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Scrape product catalog
        run: python scripts/scrape_beycost.py

      - name: Commit catalog when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "Update scraped Beyblade X catalog"
          git push
